version: '3.9'

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: payflow-server
    ports:
      - '5000:5000'
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
      PORT: 5000
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: payflow-client
    ports:
      - '5173:5173'
    env_file:
      - ./client/.env
    environment:
      VITE_API_URL: http://localhost:5000
    depends_on:
      - server
    restart: unless-stopped
